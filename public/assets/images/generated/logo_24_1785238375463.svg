        </g>
        <text x="150" y="123" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">건강</text>
  </g>
  <text x="150" y="242" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">건강한 식사, 오로라 레스토랑</text>
